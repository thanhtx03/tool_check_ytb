<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Channel Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" fill="currentColor" class="yt-icon">
          <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0C.488 3.45.029 5.804 0 12c.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0C23.512 20.55 23.971 18.196 24 12c-.029-6.185-.484-8.549-4.385-8.816zM9 16V8l8 3.993L9 16z"/>
        </svg>
        <span class="header-title">YT Channel Checker</span>
      </div>
    </header>

    <!-- Main View -->
    <div class="main-view" id="mainView">

      <!-- Date Selector -->
      <div class="date-section">
        <div class="date-row">
          <div class="input-group flex-1">
            <label class="input-label">Ngày kiểm tra</label>
            <input type="date" id="checkDate" class="input-field date-input">
          </div>
        </div>
        <div class="quick-dates">
          <button class="quick-date-btn active" data-offset="0">Hôm nay</button>
          <button class="quick-date-btn" data-offset="-1">Hôm qua</button>
          <button class="quick-date-btn" data-offset="-2">-2 ngày</button>
          <button class="quick-date-btn" data-offset="-3">-3 ngày</button>
          <button class="quick-date-btn" data-offset="-7">-7 ngày</button>
        </div>
      </div>

      <!-- Channel List Input -->
      <div class="channels-section">
        <div class="section-header">
          <span class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.95A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/>
              <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/>
            </svg>
            Danh sách kênh
          </span>
          <div class="header-btn-group">
            <!-- Paste URLs Button -->
            <button class="import-file-btn" id="pasteToggleBtn" title="Dán danh sách link từ file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                <line x1="12" y1="11" x2="12" y2="17"/>
                <line x1="9" y1="14" x2="15" y2="14"/>
              </svg>
              Dán link
            </button>
            <button class="add-channel-btn" id="addChannelBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Thêm kênh
            </button>
            <button class="clear-all-btn" id="clearAllBtn" title="Xóa tất cả các link kênh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
              </svg>
              Xoá hết
            </button>
          </div>

        </div>

        <!-- Paste Area (toggle) -->
        <div class="paste-area" id="pasteArea" style="display:none">
          <div class="paste-header">
            <span class="paste-title">📋 Dán danh sách link YouTube</span>
            <div class="paste-header-actions">
              <button class="paste-clip-btn" id="pasteClipBtn" title="Dán nhanh nội dung từ Clipboard">📋 Dán Clipboard</button>
              <button class="paste-close-btn" id="pasteCloseBtn">✕</button>
            </div>
          </div>
          <textarea
            id="pasteTextarea"
            class="paste-textarea"
            rows="6"
            placeholder="Dán link ở đây — mỗi dòng 1 link kênh&#10;Ví dụ:&#10;https://www.youtube.com/channel/UCxxxxxxx&#10;youtube.com/@kenhcuaban&#10;&#10;Mẹo: Mở file .txt → Ctrl+A → Ctrl+C → Dán vào đây"
          ></textarea>
          <div class="paste-actions">
            <span class="paste-hint" id="pasteHint">0 link phát hiện</span>
            <button class="btn btn-paste" id="pasteImportBtn" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Nạp kênh
            </button>
          </div>
        </div>

        <!-- File Badge: hiện tên/số kênh đã import (persistent) -->
        <div class="file-badge" id="fileBadge" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="file-badge-icon">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <div class="file-badge-info">
            <span class="file-badge-name" id="fileBadgeName"></span>
            <span class="file-badge-count" id="fileBadgeCount"></span>
          </div>
          <button class="file-badge-clear" id="fileBadgeClear" title="Xoá, nhập thủ công">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- Channel Input List -->
        <div class="channel-inputs" id="channelInputs">
          <!-- Dynamically rendered -->
        </div>
      </div>

      <!-- Check Button -->
      <div class="action-section">
        <button class="btn btn-primary btn-check" id="checkBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          Kiểm tra tất cả
        </button>
      </div>

      <!-- Results -->
      <div class="results-wrapper" id="resultsWrapper" style="display:none">
        <div class="results-header">
          <span class="results-title" id="resultsTitle">Kết quả</span>
          <span class="results-date-badge" id="resultsDateBadge"></span>
        </div>
        <div class="results-list" id="resultsList"></div>
      </div>

    </div><!-- end main-view -->
  </div>

  <script src="popup.js"></script>
</body>
</html>
