<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Channel Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" fill="currentColor" class="yt-icon">
          <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0C.488 3.45.029 5.804 0 12c.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0C23.512 20.55 23.971 18.196 24 12c-.029-6.185-.484-8.549-4.385-8.816zM9 16V8l8 3.993L9 16z"/>
        </svg>
        <span class="header-title">YT Channel Checker</span>
      </div>
      <button class="settings-btn" id="settingsBtn" title="Cài đặt API Key">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <!-- API Key Setup Panel -->
    <div class="panel" id="apiPanel" style="display:none">
      <div class="panel-header">
        <h2>🔑 Cài đặt YouTube API Key</h2>
        <button class="close-btn" id="closePanelBtn">✕</button>
      </div>

      <div class="api-guide">
        <div class="guide-step">
          <div class="step-num">1</div>
          <div class="step-content">
            <strong>Truy cập Google Cloud Console</strong>
            <a href="https://console.cloud.google.com/" target="_blank" class="link-btn">Mở Console →</a>
          </div>
        </div>
        <div class="guide-step">
          <div class="step-num">2</div>
          <div class="step-content">
            <strong>Tạo project mới</strong> → Enable "YouTube Data API v3"
          </div>
        </div>
        <div class="guide-step">
          <div class="step-num">3</div>
          <div class="step-content">
            <strong>Tạo API Key</strong> trong mục Credentials → Copy
          </div>
        </div>
        <div class="guide-step">
          <div class="step-num">4</div>
          <div class="step-content">
            <strong>Dán API Key vào đây</strong> (miễn phí 10.000 req/ngày)
          </div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">YouTube Data API Key</label>
        <div class="input-wrapper">
          <input type="password" id="apiKeyInput" class="input-field" placeholder="AIzaSy...">
          <button class="eye-btn" id="toggleApiKey">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn btn-primary" id="saveApiBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Lưu API Key
      </button>
    </div>

    <!-- Main View -->
    <div class="main-view" id="mainView">

      <!-- No API Warning -->
      <div class="no-api-banner" id="noApiBanner" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>Chưa có API Key. <button class="link-text-btn" id="goToApiBtn">Cài đặt ngay →</button></span>
      </div>

      <!-- Date Selector -->
      <div class="date-section">
        <div class="date-row">
          <div class="input-group flex-1">
            <label class="input-label">Ngày kiểm tra</label>
            <input type="date" id="checkDate" class="input-field date-input">
          </div>
        </div>
        <div class="quick-dates">
          <button class="quick-date-btn active" data-offset="0">Hôm nay</button>
          <button class="quick-date-btn" data-offset="-1">Hôm qua</button>
          <button class="quick-date-btn" data-offset="-2">-2 ngày</button>
          <button class="quick-date-btn" data-offset="-3">-3 ngày</button>
          <button class="quick-date-btn" data-offset="-7">-7 ngày</button>
        </div>
      </div>

      <!-- Channel List Input -->
      <div class="channels-section">
        <div class="section-header">
          <span class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.95A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/>
              <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/>
            </svg>
            Danh sách kênh
          </span>
          <div class="header-btn-group">
            <!-- Import File: dùng label để tránh popup bị đóng khi JS gọi .click() -->
            <label class="import-file-btn" id="importFileBtn" title="Import từ file .txt / .md">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              Import file
              <input
                type="file"
                id="fileInput"
                accept=".txt,.md,.csv,.text"
                style="display:none"
              >
            </label>
            <button class="add-channel-btn" id="addChannelBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Thêm kênh
            </button>
          </div>

        </div>

        <!-- File Badge: hiện tên file đã import (persistent) -->
        <div class="file-badge" id="fileBadge" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="file-badge-icon">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <div class="file-badge-info">
            <span class="file-badge-name" id="fileBadgeName"></span>
            <span class="file-badge-count" id="fileBadgeCount"></span>
          </div>
          <button class="file-badge-clear" id="fileBadgeClear" title="Xoá file, nhập thủ công">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- Channel Input List -->
        <div class="channel-inputs" id="channelInputs">
          <!-- Dynamically rendered -->
        </div>
      </div>

      <!-- Check Button -->
      <div class="action-section">
        <button class="btn btn-primary btn-check" id="checkBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          Kiểm tra tất cả
        </button>
      </div>

      <!-- Results -->
      <div class="results-wrapper" id="resultsWrapper" style="display:none">
        <div class="results-header">
          <span class="results-title" id="resultsTitle">Kết quả</span>
          <span class="results-date-badge" id="resultsDateBadge"></span>
        </div>
        <div class="results-list" id="resultsList"></div>
      </div>

    </div><!-- end main-view -->
  </div>

  <script src="popup.js"></script>
</body>
</html>
